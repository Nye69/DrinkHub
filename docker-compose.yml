services:
  drinkhub:
    image: ghcr.io/pixlgalaxy/drinkhub:latest
    build: .
    ports:
      - "8080:80"
    environment:
      # Optional: set to keep sessions valid across volume resets.
      # If empty, a secret is generated once and stored in drinkhub-server.
      SESSION_SECRET: ""
    volumes:
      - drinkhub-server:/app/backend/server/data
      - drinkhub-sipitordipit:/app/backend/sipitordipit/data
      - drinkhub-pyramid:/app/backend/pyramid/data
    restart: unless-stopped

volumes:
  drinkhub-server:
  drinkhub-sipitordipit:
  drinkhub-pyramid:
